name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes archives, checksums, SBOMs, and a signed OCI image for the
  # release that release-please just created. Runs only when
  # release-please actually cut a new release on this push, so plain
  # "chore: release" PR merges without a version bump do not trigger a
  # publish. The registry defaults to ghcr.io for GitHub; a self-hosted
  # Forgejo runner overrides REGISTRY and supplies REGISTRY_USERNAME /
  # REGISTRY_TOKEN instead of relying on github.actor / GITHUB_TOKEN.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod now carries an explicit "toolchain go1.26.8" line, so the
          # exact patch used to build signed releases is pinned in source
          # control and reproducible: bumping it (e.g. after a Go security
          # release) is an ordinary PR, not an out-of-band CI drift. Use
          # go-version-file so this job builds with exactly that pinned
          # toolchain rather than resolving "newest 1.26.x at release time";
          # the `go` command itself downloads and verifies that toolchain
          # against sum.golang.org if it is not already the one on the
          # runner, so no separate integrity check is needed here.
          go-version-file: go.mod
          # A signed release build must not restore a Go module/build cache
          # written by another job (e.g. the test matrix); disable
          # setup-go's cache entirely for this job rather than trust cache
          # provenance for artifacts that get cosign-signed.
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Registry login: GitHub Container Registry uses the workflow actor
      # and the ephemeral GITHUB_TOKEN. A self-hosted Forgejo instance has
      # no equivalent OIDC-backed token, so it supplies REGISTRY_USERNAME
      # and REGISTRY_TOKEN secrets instead; when those are unset (the
      # GitHub case) the github.actor / GITHUB_TOKEN fallback is used.
      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser's `sboms:` pipe shells out to syft; it is not bundled
      # with the goreleaser-action, so it must be installed explicitly
      # before the release runs, or the sboms step fails.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          # Keyless cosign signing (checksums.txt via goreleaser `signs:`,
          # images via `docker_signs:`) is driven by the OIDC token that
          # id-token: write grants this job; no COSIGN_* secret is needed
          # on github.com. A Forgejo runner without Sigstore OIDC support
          # would need to disable signs/docker_signs or provide key-based
          # cosign credentials instead.

      # Build provenance attestation is a GitHub-specific feature (uses the
      # GitHub attestations API), so it is skipped entirely off github.com,
      # e.g. on a self-hosted Forgejo mirror of this workflow.
      - name: Attest archive provenance
        if: github.server_url == 'https://github.com'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"
