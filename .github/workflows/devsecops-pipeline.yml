name: DevSecOps Attested Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Per-check-type signing keys are stored as GitHub Actions secrets.
  # Generate a key pair for each check with: go run ./cmd/keygen
  # Secrets required: SAST_SIGNING_KEY, SCA_SIGNING_KEY, CONFIG_SIGNING_KEY, SECRET_SCANNING_SIGNING_KEY
  # Public key secrets for gate verification: SAST_PUBLIC_KEY, SCA_PUBLIC_KEY, CONFIG_PUBLIC_KEY, SECRET_SCANNING_PUBLIC_KEY
  ARTIFACT_REF: ${{ github.sha }}
  APP_NAME: ${{ github.repository }}
  # GitHub Actions run URL for transparency log entries.
  LOG_ENTRY_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Run the full unit test suite before any security or signing steps.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests with coverage
        run: |
          go test -coverprofile=coverage.txt ./...
          go tool cover -func=coverage.txt | tail -1

      - name: Run unit tests with race detector
        run: go test -race ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.txt
          retention-days: 7

  # Phase 1 + 2: Run security checks, sign each result, build chain
  # This job holds every signing key secret (SAST_SIGNING_KEY, ...). On
  # pull_request, GitHub exposes secrets to the workflow even for forked
  # PRs when the base workflow defines them, so a forked PR could exfil
  # every signing key through a modified pipeline step unless this job is
  # gated. Only run for push events (this repo's own branches) or a
  # pull_request whose head repository is this same repository (an
  # internal branch, not a fork); dependabot/renovate PRs are excluded the
  # same way.
  security-checks:
    permissions:
      contents: read
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    env:
      GITLEAKS_VERSION: '8.21.2'
      TRIVY_VERSION: '0.74.0'
      SEMGREP_VERSION: '1.177.0'
      CHECKOV_VERSION: '3.3.19'
    outputs:
      chain-artifact: ${{ steps.upload-chain.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build attestation tooling
        run: |
          mkdir -p bin
          go build -o ./bin/keygen ./cmd/keygen
          go build -o ./bin/attest ./cmd/sign
          go build -o ./bin/verify ./cmd/verify
          go build -o ./bin/gate ./cmd/gate

      # SAST
      - name: Run SAST (semgrep)
        id: sast
        run: |
          set -euo pipefail
          pip install --quiet "semgrep==${SEMGREP_VERSION}"
          rm -f semgrep-raw.json
          # semgrep scan --json exits 0 both when it finds nothing AND when
          # it finds something, as long as --error is not passed (which
          # this invocation deliberately omits: the pass/fail decision
          # belongs to the gate, not this step, so findings must not fail
          # the job). A nonzero exit here is therefore always a genuine
          # scan failure, never "findings", so it is left to propagate.
          # --disable-nosem: report findings a `# nosemgrep` comment would
          # otherwise silently suppress in the raw scan output, so a
          # suppression comment cannot be used to hide a real finding from
          # the signed attestation. --metrics=off is deliberately not
          # passed: semgrep 1.177.0 refuses to resolve --config auto with
          # metrics disabled ("Cannot create auto config when metrics are
          # off"), confirmed by running this exact command locally; #37's
          # workflow (feat/composite-actions) omits it for the same reason.
          semgrep scan --config auto --disable-nosem --json --output semgrep-raw.json .
          jq -e . semgrep-raw.json >/dev/null
          test -s semgrep-raw.json

      - name: Sign SAST attestation
        run: |
          ./bin/attest sign \
            --tool-format semgrep \
            --tool-version "$(semgrep --version 2>/dev/null || echo unknown)" \
            --result semgrep-raw.json \
            --target-ref "$ARTIFACT_REF" \
            --subject "$APP_NAME" \
            --signing-key "${{ secrets.SAST_SIGNING_KEY }}" \
            --signer-id "github-runner:${{ runner.os }}" \
            --log-entry "$LOG_ENTRY_URL" \
            --chain attestation-chain.json

      # SCA
      - name: Install trivy (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sfLO "${base}/${asset}"
          curl -sfLO "${base}/${checksums}"
          sha256sum --ignore-missing -c "${checksums}"
          tar xzf "${asset}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Run SCA (trivy)
        id: sca
        run: |
          set -euo pipefail
          rm -f trivy-raw.json
          # --exit-code 0 makes trivy always exit 0 for a completed scan,
          # findings or not (the gate makes the pass/fail decision, not
          # this step); a nonzero exit is a genuine scan failure and is
          # left to propagate.
          trivy fs --format json --output trivy-raw.json --scanners vuln --exit-code 0 .
          jq -e . trivy-raw.json >/dev/null
          test -s trivy-raw.json

      - name: Sign SCA attestation
        run: |
          ./bin/attest sign \
            --tool-format trivy \
            --tool-version "$(trivy --version 2>/dev/null | head -1 || echo unknown)" \
            --result trivy-raw.json \
            --target-ref "$ARTIFACT_REF" \
            --subject "$APP_NAME" \
            --signing-key "${{ secrets.SCA_SIGNING_KEY }}" \
            --signer-id "github-runner:${{ runner.os }}" \
            --log-entry "$LOG_ENTRY_URL" \
            --chain attestation-chain.json

      # Config / IaC
      - name: Run config check (checkov)
        id: config
        run: |
          set -euo pipefail
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          rm -rf checkov-out checkov-raw.json
          # --soft-fail makes checkov exit 0 on failed checks (the gate
          # makes the pass/fail decision, not this step); a crash (no
          # results_json.json produced) is caught below by `mv` failing.
          # checkov 3.x writes <output-file-path>/results_json.json, not
          # results.json, when --output-file-path names a directory.
          checkov -d . --output json --output-file-path checkov-out --quiet --soft-fail --skip-path pkg/normalize/testdata
          mv checkov-out/results_json.json checkov-raw.json
          jq -e . checkov-raw.json >/dev/null
          test -s checkov-raw.json

      - name: Sign config attestation
        run: |
          ./bin/attest sign \
            --tool-format checkov \
            --tool-version "$(checkov --version 2>/dev/null || echo unknown)" \
            --result checkov-raw.json \
            --target-ref "$ARTIFACT_REF" \
            --subject "$APP_NAME" \
            --signing-key "${{ secrets.CONFIG_SIGNING_KEY }}" \
            --signer-id "github-runner:${{ runner.os }}" \
            --log-entry "$LOG_ENTRY_URL" \
            --chain attestation-chain.json

      # Secret scan
      - name: Install gitleaks (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sfLO "${base}/${asset}"
          curl -sfLO "${base}/${checksums}"
          sha256sum --ignore-missing -c "${checksums}"
          tar xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run secret scan (gitleaks)
        id: secrets
        run: |
          set -euo pipefail
          rm -f gitleaks-raw.json
          # --exit-code 0 makes gitleaks always exit 0, leaks found or not
          # (the gate makes the pass/fail decision, not this step); a
          # nonzero exit is a genuine scan failure and is left to
          # propagate. The jq check below is a second line of defense in
          # case a future gitleaks version stops honoring --exit-code for
          # some failure mode.
          gitleaks detect --report-format json --report-path gitleaks-raw.json --exit-code 0
          jq -e . gitleaks-raw.json >/dev/null
          test -s gitleaks-raw.json

      - name: Sign secret scan attestation
        run: |
          ./bin/attest sign \
            --tool-format gitleaks \
            --tool-version "$(gitleaks version 2>/dev/null || echo unknown)" \
            --result gitleaks-raw.json \
            --target-ref "$ARTIFACT_REF" \
            --subject "$APP_NAME" \
            --signing-key "${{ secrets.SECRET_SCANNING_SIGNING_KEY }}" \
            --signer-id "github-runner:${{ runner.os }}" \
            --log-entry "$LOG_ENTRY_URL" \
            --chain attestation-chain.json

      - name: Verify chain integrity
        run: |
          ./bin/verify \
            --chain attestation-chain.json

      - name: Upload attestation chain
        id: upload-chain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attestation-chain-${{ github.sha }}
          path: attestation-chain.json
          retention-days: 90

  # Deploy gate: verify chain and evaluate policy. This job also requests
  # id-token: write and attestations: write, and reads the *_PUBLIC_KEY
  # secrets, so it is gated the same way as security-checks above.
  deploy-gate:
    needs: security-checks
    runs-on: ubuntu-latest
    environment: production
    if: >-
      (github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binaries
        run: |
          mkdir -p bin release
          go build -o ./bin/gate    ./cmd/gate
          go build -o ./release/keygen ./cmd/keygen
          go build -o ./release/attest ./cmd/sign
          go build -o ./release/verify ./cmd/verify
          go build -o ./release/gate   ./cmd/gate

      - name: Download attestation chain
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: attestation-chain-${{ github.sha }}

      - name: Evaluate deploy gate
        id: gate
        run: |
          ./bin/gate evaluate \
            --chain attestation-chain.json \
            --authorized-signers "sast=${{ secrets.SAST_PUBLIC_KEY }},sca=${{ secrets.SCA_PUBLIC_KEY }},config=${{ secrets.CONFIG_PUBLIC_KEY }},secret=${{ secrets.SECRET_SCANNING_PUBLIC_KEY }}" \
            --policy policies/deploy.rego \
            --policy-hash d90ce4eb57a3ce0b208037dba73c10959f5e2d16b2f418311da2fe117074aa0a \
            --max-age 24h \
            --require-log-entries \
            --output gate-decision.json

      - name: Check gate decision
        run: |
          ALLOW=$(jq -r '.allow' gate-decision.json)
          REASONS=$(jq -r '.reasons[]' gate-decision.json)
          echo "Gate decision: $ALLOW"
          echo "Reasons: $REASONS"
          if [ "$ALLOW" != "true" ]; then
            echo "::error::Deploy gate blocked: $REASONS"
            exit 1
          fi

      - name: Package release artifacts
        run: |
          cp attestation-chain.json release/
          cp gate-decision.json     release/
          echo "$ARTIFACT_REF" > release/COMMIT

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/keygen
            release/attest
            release/verify
            release/gate

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 30
