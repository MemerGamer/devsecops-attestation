# Unsigned archives and SBOMs only. No container, signing or publishing pipe.
version: 2

project_name: devsecops-attestation

before:
  hooks:
    - sh -c 'go mod tidy && git diff --exit-code -- go.mod go.sum'

builds:
  - id: keygen
    main: ./cmd/keygen
    binary: keygen
    env:
      - CGO_ENABLED=0
      - GOAMD64=v1
      - GOARM64=v8.0
      - GOENV=off
      - GOWORK=off
      - GOTOOLCHAIN=local
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: attest
    main: ./cmd/sign
    binary: attest
    env:
      - CGO_ENABLED=0
      - GOAMD64=v1
      - GOARM64=v8.0
      - GOENV=off
      - GOWORK=off
      - GOTOOLCHAIN=local
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: verify
    main: ./cmd/verify
    binary: verify
    env:
      - CGO_ENABLED=0
      - GOAMD64=v1
      - GOARM64=v8.0
      - GOENV=off
      - GOWORK=off
      - GOTOOLCHAIN=local
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: gate
    main: ./cmd/gate
    binary: gate
    env:
      - CGO_ENABLED=0
      - GOAMD64=v1
      - GOARM64=v8.0
      - GOENV=off
      - GOWORK=off
      - GOTOOLCHAIN=local
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - keygen
      - attest
      - verify
      - gate
    name_template: "devsecops-attestation_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - src: policies/deploy.rego
        dst: policies/deploy.rego

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

    documents:
      - "{{ .ArtifactName }}.sbom.json"

# CI builds only. Hunor verifies and publishes the local bytes separately.
release:
  disable: true

force_token: gitea

changelog:
  disable: true
