name: devsecops-attestation setup
description: >-
  Downloads (or builds from source) the devsecops-attestation CLI binaries
  (keygen, attest, verify, gate) and the bundled deploy.rego policy, verifies
  the release checksum, and adds the binaries to PATH. Runs on bash only, so
  it works on both GitHub Actions and Forgejo Actions runners.
author: MemerGamer

inputs:
  version:
    description: >-
      Release version to install, e.g. "1.2.3" or "v1.2.3". Pass "source" to
      build the binaries from this action's own checkout with `go build`
      (requires Go on PATH); useful for dogfooding and testing pull requests
      against the actions themselves. This separate trust path trusts the checkout,
      local changes, Go and modules. It needs no release URL or Cosign and works
      with the default verify-signature setting; release failures never select it.
    required: true
  repository:
    description: >-
      Project name for consumer documentation. Verification identities and release
      keys are fixed in the pinned action and cannot be overridden by this input.
    required: false
    default: MemerGamer/devsecops-attestation
  download-base-url:
    description: >-
      Base URL that release archives are downloaded from; the tag
      (v<version>) and file name are appended. When empty, legacy 0.4.0 to 0.4.2 use GitHub; newer releases use GitHub
      on github.com and canonical Forgejo on other servers. Local release
      runs require an explicit URL. Override for a mirror, e.g.
      https://forgejo.example.com/kbalinthunor/devsecops-attestation/releases/download.
    required: false
    default: ""
  install-dir:
    description: Directory the binaries and policy are installed into and added to PATH.
    required: false
    default: ${{ runner.temp }}/devsecops-attestation/bin
  verify-signature:
    description: >-
      When "true" (the default), verify checksums.txt with a fixed release key
      and cryptographically verified public Rekor evidence. Legacy 0.4.0 to
      0.4.2 require their fixed GitHub workflow identity and pinned manifest
      digests. Requires stable Cosign v3, at least v3.0.2. An explicit "false"
      skips signatures and Rekor only; version and checksum rules still apply.
      Source mode consumes no release and needs no signature verification.
    required: false
    default: "true"

outputs:
  bin-dir:
    description: Directory containing the installed keygen/attest/verify/gate binaries.
    value: ${{ steps.install.outputs.bin-dir }}
  policy-path:
    description: Path to the bundled deploy.rego policy installed alongside the binaries.
    value: ${{ steps.install.outputs.policy-path }}
  version:
    description: Resolved version string ("source" when built from source).
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_DOWNLOAD_BASE_URL: ${{ inputs.download-base-url }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        INPUT_VERIFY_SIGNATURE: ${{ inputs.verify-signature }}
      run: bash "${GITHUB_ACTION_PATH}/setup.sh"
